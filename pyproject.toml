[project]
name = "baseten"
version = "0.10.0"
description = "Baseten Python SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "autodoc-pydantic>=2.2.0",
    # Capped at <0.56: starting in later releases (confirmed in 0.59.1),
    # complex object/scalar defaults are emitted as raw literals assigned to
    # model-typed fields (e.g. `x: Model | None = {..dict..}`, `Limit | None =
    # 500`) with validate_default=True, instead of the previous typed
    # `default_factory=lambda: Model.model_validate(...)`. Pydantic validates
    # these at runtime, but the literal does not match the annotation, so ty
    # rejects the generated code. No flag restores the old emission.
    "datamodel-code-generator>=0.55.0,<0.56",
    "furo>=2025.12.19",
    "poethepoet>=0.35",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0",
    "ruff>=0.15.16",
    "sphinx>=8.1.3",
    "ty>=0.0.43",
]

[project.urls]
Homepage = "https://github.com/basetenlabs/baseten-python"
Issues = "https://github.com/basetenlabs/baseten-python/issues"

[tool.poe.tasks]
generate-api = "python -m scripts.apigen"
generate-docs = "sphinx-build -j auto -b html -d .doctrees scripts/docgen _site"
typecheck = "ty check"
test = "pytest"

[tool.poe.tasks.format]
sequence = [
    { cmd = "ruff format ." },
    { cmd = "ruff check --fix --exit-zero ." },
]

[tool.poe.tasks.lint]
sequence = [
    { cmd = "ruff format --check ." },
    { cmd = "ruff check ." },
]

# TODO: Set exclude-newer when closer to stable release
# [tool.uv]
# exclude-newer = "7 days"

[tool.ty.src]
exclude = ["scripts/docgen/", "scripts/e2e_test_bootstrap/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# baseten is a PEP 420 namespace package shared across baseten-* distributions
# (e.g. baseten-loops provides baseten.loops). There is intentionally no
# baseten/__init__.py; this names the namespace dir for hatchling to package.
[tool.hatch.build.targets.wheel]
packages = ["baseten"]

[tool.pytest.ini_options]
testpaths = ["tests"]
