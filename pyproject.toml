[project]
name = "baseten"
version = "0.9.0"
description = "Baseten Python SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.55.0",
    "poethepoet>=0.35",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
    "ty>=0.0.26",
]

[project.urls]
Homepage = "https://github.com/basetenlabs/baseten-python"
Issues = "https://github.com/basetenlabs/baseten-python/issues"

[tool.poe.tasks]
generate-api = "python -m scripts.apigen"
typecheck = "ty check"
test = "pytest"

[tool.poe.tasks.format]
sequence = [
    { cmd = "ruff format ." },
    { cmd = "ruff check --fix --exit-zero ." },
]

[tool.poe.tasks.lint]
sequence = [
    { cmd = "ruff format --check ." },
    { cmd = "ruff check ." },
]

# TODO: Set exclude-newer when closer to stable release
# [tool.uv]
# exclude-newer = "7 days"

[tool.ty.src]
exclude = ["scripts/e2e_test_bootstrap/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
