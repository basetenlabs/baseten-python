name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv build

      - uses: chainguard-actions/pypa-gh-action-pypi-publish@3281eae6a06d4b96e24616f7821380f05fa50296 # v1.14.3
